name: Publish

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/**.md'
      - '.github/**'

jobs:
  publish:
    name: Publish the app
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout source code
      uses: actions/checkout@v5
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    
    - name: Publish
      shell: pwsh
      run: |
        Set-Location "$env:GITHUB_WORKSPACE"
        dotnet publish -c release -r win-x64 -p:PublishDir="$env:GITHUB_WORKSPACE\Release\win-x64" --sc --nologo
        Compress-Archive -Path "$env:GITHUB_WORKSPACE\Release\win-x64" -DestinationPath "EGS-win-x64.zip"
    
    - name: Recreate Latest Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "Deleting existing Release..."

        try {
          gh release delete latest --yes --cleanup-tag
        }
        catch {
          Write-Host "Release 'latest' does not exist."
        }

        git tag -d latest 2>$null

        Write-Host "Creating new Release..."

        gh release create latest `
          EGS-win-x64.zip `
          --target $env:GITHUB_SHA `
          --title "Latest" `
          --notes "" `
          --latest
